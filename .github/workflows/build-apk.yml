name: Build & Test Business Mileage Tracker APK

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main", "feature/**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Restore Verified Run 96 Debug Signing Key
        env:
          RUN96_KEYSTORE: ${{ secrets.RUN96_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RUN96_KEYSTORE" ]; then
            echo "Run 96 signing key is required; refusing to generate an incompatible key."
            exit 1
          fi
          umask 077
          mkdir -p app/keystore
          printf '%s' "$RUN96_KEYSTORE" | base64 --decode > app/keystore/debug.keystore
          keytool -exportcert -keystore app/keystore/debug.keystore -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/run96-cert.der"
          echo "43efd34a84878e7aa8290b276f65d3171b79965d05de9223f86d8c4dd6901948  $RUNNER_TEMP/run96-cert.der" | sha256sum --check

      - name: Run Unit Tests & Assemble Debug APK
        run: ./gradlew testDebugUnitTest testReleaseUnitTest assembleDebug --stacktrace

      - name: Upload Build Reports On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Verify APK Signature Matches Installed Run 96
        env:
          APK_PATH: ${{ steps.find_apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APK_SIGNER" verify --verbose --print-certs "$APK_PATH" > "$RUNNER_TEMP/apk-signature.txt"
          grep -F "Signer #1 certificate SHA-256 digest: 43efd34a84878e7aa8290b276f65d3171b79965d05de9223f86d8c4dd6901948" "$RUNNER_TEMP/apk-signature.txt"

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessMileageTracker-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
