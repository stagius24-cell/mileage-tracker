name: Build & Test Business Mileage Tracker APK

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main", "feature/**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Ensure Deterministic Debug Keystore
        run: |
          mkdir -p app/keystore
          if [ -f app/keystore/debug.keystore.base64 ]; then
            base64 -d app/keystore/debug.keystore.base64 > app/keystore/debug.keystore
          elif [ ! -s app/keystore/debug.keystore ] || ! keytool -list -keystore app/keystore/debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "Generating permanent debug keystore via keytool"
            rm -f app/keystore/debug.keystore
            keytool -genkey -v -keystore app/keystore/debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "=== KEYSTORE BASE64 START ==="
            base64 -w 0 app/keystore/debug.keystore
            echo ""
            echo "=== KEYSTORE BASE64 END ==="
          fi
          keytool -list -v -keystore app/keystore/debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey

      - name: Save Signing Fingerprints & Lock Keystore
        run: |
          mkdir -p docs app/keystore
          keytool -list -v -keystore app/keystore/debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey > docs/SIGNING_FINGERPRINTS.txt
          base64 -w 0 app/keystore/debug.keystore > app/keystore/debug.keystore.base64
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/SIGNING_FINGERPRINTS.txt app/keystore/debug.keystore.base64
          git commit -m "docs(keystore): publish signing fingerprints and locked debug keystore" || true
          git push || true

      - name: Run Unit Tests & Assemble Debug APK
        run: ./gradlew testDebugUnitTest testReleaseUnitTest assembleDebug --stacktrace

      - name: Upload Build Reports On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessMileageTracker-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
