name: Build & Test Business Mileage Tracker APK

on:
  push:
    branches: [ "main", "feature/**", "fix/**", "audit/**" ]
  pull_request:
    branches: [ "main", "feature/**", "fix/**", "audit/**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Verify Gradle Wrapper
        run: |
          echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          chmod +x gradlew

      # Restore stable run 96 debug signing key from GitHub Secrets
      - name: Restore Stable Debug Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.RUN96_DEBUG_KEYSTORE_BASE64 || secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Required secret RUN96_DEBUG_KEYSTORE_BASE64 (or DEBUG_KEYSTORE_BASE64) is missing. Refusing to generate a disposable key to avoid INSTALL_FAILED_UPDATE_INCOMPATIBLE."
            exit 1
          fi
          umask 077
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/debug.keystore

          # Pre-build validation of keystore certificate fingerprint
          keytool -exportcert -keystore app/keystore/debug.keystore -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/restored-cert.der"
          EXPECTED_SHA256="43efd34a84878e7aa8290b276f65d3171b79965d05de9223f86d8c4dd6901948"
          ACTUAL_SHA256=$(sha256sum "$RUNNER_TEMP/restored-cert.der" | awk '{print $1}')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Restored keystore certificate SHA-256 ($ACTUAL_SHA256) does not match expected run 96 key ($EXPECTED_SHA256)! Aborting to prevent install incompatibility."
            exit 1
          fi
          echo "Verified restored keystore matches expected run 96 signing identity."

      - name: Run Unit Tests & Assemble Debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: ./gradlew testDebugUnitTest testReleaseUnitTest assembleDebug --stacktrace

      - name: Repeat final validation
        run: ./gradlew testDebugUnitTest testReleaseUnitTest assembleDebug --rerun-tasks --stacktrace

      - name: Upload Build Reports On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Verify APK Signature, Application ID, and Version Code
        env:
          APK_PATH: ${{ steps.find_apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)

          echo "Using apksigner: $APK_SIGNER"
          echo "Using aapt2: $AAPT2"

          # 1. Verify signature with apksigner
          "$APK_SIGNER" verify --verbose --print-certs "$APK_PATH" > "$RUNNER_TEMP/apk-signature.txt"
          cat "$RUNNER_TEMP/apk-signature.txt"

          EXPECTED_SHA256="43efd34a84878e7aa8290b276f65d3171b79965d05de9223f86d8c4dd6901948"
          EXPECTED_SHA1="32d6afa108beed313e181a08176ded0fd960af43"

          grep -Fi "certificate SHA-256 digest: $EXPECTED_SHA256" "$RUNNER_TEMP/apk-signature.txt"
          grep -Fi "certificate SHA-1 digest: $EXPECTED_SHA1" "$RUNNER_TEMP/apk-signature.txt"
          echo "APK certificate signature verification PASSED (matches run 96 stable identity)."

          # 2. Verify Application ID with aapt2
          "$AAPT2" dump badging "$APK_PATH" > "$RUNNER_TEMP/apk-badging.txt"
          EXPECTED_APP_ID="com.businesstracker.mileage.debug"
          grep -E "package: name='$EXPECTED_APP_ID'" "$RUNNER_TEMP/apk-badging.txt"
          echo "APK Application ID verification PASSED ($EXPECTED_APP_ID)."

          # 3. Verify Version Code >= 32
          VERSION_CODE=$(grep -oE "versionCode='[0-9]+'" "$RUNNER_TEMP/apk-badging.txt" | head -n 1 | grep -oE "[0-9]+")
          VERSION_NAME=$(grep -oE "versionName='[^']+'" "$RUNNER_TEMP/apk-badging.txt" | head -n 1 | cut -d"'" -f2)
          echo "APK versionCode=$VERSION_CODE, versionName=$VERSION_NAME"
          if [ "$VERSION_CODE" -lt 60 ]; then
            echo "::error::versionCode ($VERSION_CODE) is lower than 60. In-place update over installed app will fail!"
            exit 1
          fi
          echo "APK version code verification PASSED ($VERSION_CODE >= 60)."

      - name: Upload Verified Update-Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessMileageTracker-v1.0.59-update-ready
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
