name: Build & Test Business Mileage Tracker APK

on:
  push:
    branches: [ "main", "feature/**", "audit/**" ]
  pull_request:
    branches: [ "main", "feature/**", "audit/**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      # CI uses a disposable debug key. The tested APK is re-signed outside CI
      # with the recovered run 96 key before being provided as an update.
      - name: Create Disposable CI Debug Key
        run: |
          set -euo pipefail
          umask 077
          mkdir -p app/keystore
          keytool -genkeypair -keystore app/keystore/debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI Intermediate,O=Android,C=US"

      - name: Run Unit Tests & Assemble Debug APK
        run: ./gradlew testDebugUnitTest testReleaseUnitTest assembleDebug --stacktrace

      - name: Repeat final validation
        run: ./gradlew testDebugUnitTest testReleaseUnitTest assembleDebug --rerun-tasks --stacktrace

      - name: Upload Build Reports On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Verify Intermediate APK Signature
        env:
          APK_PATH: ${{ steps.find_apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APK_SIGNER" verify --verbose --print-certs "$APK_PATH" > "$RUNNER_TEMP/apk-signature.txt"

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CI-intermediate-APK-needs-run96-signing
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
